services:
  # 1. Database
  db:
    image: postgres:17-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d the_hub"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: the_hub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Go Backend
  backend:
    build:
      context: ./the-hub-backend 
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - ./the-hub-backend:/app
    environment:
      # Use 'db' as the hostname, not localhost
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=the_hub
      - DB_SSL_MODE=disable 
      # Server Configuration
      - PORT=8080
      - GIN_MODE=debug
      - ALLOWED_URL=*
      - APP_ENV=development
    depends_on:
      db:
        condition: service_healthy

  # 3. Nuxt Frontend (Bun)
  frontend:
    build:
      context: ./the-hub-frontend 
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./the-hub-frontend:/src
      - /src/node_modules
    environment:
      - API_BASE=http://backend:8080
    depends_on:
      - backend

  # AI 
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"   # expose for local debugging; remove if only your app needs it
    volumes:
      - ollama_models:/root/.ollama   # persists downloaded models across restarts
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - OLLAMA_CONTEXT_LENGTH=4096   # keep small — task text is short, saves VRAM/RAM

volumes:
  postgres_data:
  ollama_models:
